<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviso de Cookies</title>
    <style>
        /* Reset e Estilos Globais */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body,
        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* Fundo (Print da Página de Vendas) */
        #background-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #f0f0f0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
        }

        /* Overlay */
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        /* O Falso Pop-up de Cookies */
        .cookie-popup {
            background-color: #ffffff;
            width: 90%;
            max-width: 480px;
            border-radius: 12px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            position: relative;
        }

        .cookie-popup h2 {
            font-size: 24px;
            color: #111;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .cookie-popup p {
            font-size: 15px;
            color: #555;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        /* Botões */
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 14px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            flex: 1;
        }

        .btn-allow {
            background-color: #000000;
            color: #ffffff;
        }

        .btn-allow:hover {
            background-color: #333333;
        }

        .btn-close {
            background-color: transparent;
            color: #111111;
            border: 1px solid #cccccc;
        }

        .btn-close:hover {
            background-color: #f5f5f5;
        }

        .footer-text {
            font-size: 12px;
            color: #888;
            margin-top: 15px;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }

        /* Botão Discreto de Administrador */
        #admin-trigger {
            position: absolute;
            bottom: 10px;
            right: 10px;
            z-index: 10;
            background-color: rgba(0, 0, 0, 0.1);
            color: rgba(255, 255, 255, 0.5);
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        #admin-trigger:hover {
            background-color: rgba(0, 0, 0, 0.8);
            color: #fff;
        }

        /* Modais do Administrador */
        .admin-modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .admin-modal-content {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            width: 90%;
            max-width: 400px;
            text-align: left;
        }

        .admin-modal-content h3 {
            margin-bottom: 20px;
            font-size: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        .admin-btn {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }

        .admin-btn:hover {
            background-color: #0056b3;
        }

        .admin-btn.cancel {
            background-color: #ccc;
            color: #333;
            margin-top: 5px;
        }

        @media (max-width: 480px) {
            .cookie-popup {
                padding: 25px 20px;
            }

            .cookie-popup h2 {
                font-size: 20px;
            }

            .cookie-popup p {
                font-size: 14px;
            }

            .btn-container {
                flex-direction: column;
                gap: 10px;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div id="background-image"></div>

    <div id="overlay">
        <div class="cookie-popup">
            <h2>Cookie Policy</h2>
            <p>This site uses cookies to customize content and ads, provide social media resources and analyze our
                traffic. By clicking "Allow", you agree to the use of cookies. For more information, visit our Cookie
                Policy.</p>

            <div class="btn-container">
                <button class="btn btn-allow">Allow</button>
                <button class="btn btn-close">Close</button>
            </div>

            <div class="footer-text">Your privacy is important to us</div>
        </div>
    </div>

    <button id="admin-trigger">Admin</button>

    <div id="password-modal" class="admin-modal">
        <div class="admin-modal-content">
            <h3>Acesso Restrito</h3>
            <div class="form-group">
                <label>Senha Mestre:</label>
                <input type="password" id="master-password" placeholder="Digite a senha...">
            </div>
            <button class="admin-btn" id="submit-password">Entrar</button>
            <button class="admin-btn cancel" id="cancel-password">Cancelar</button>
        </div>
    </div>

    <div id="admin-panel" class="admin-modal">
        <div class="admin-modal-content">
            <h3>Painel de Administrador</h3>
            <div class="form-group">
                <label>URL da Imagem de Fundo (Print da Página):</label>
                <input type="text" id="input-bg-url" placeholder="https://exemplo.com/imagem.jpg">
            </div>
            <div class="form-group">
                <label>Link de Destino (Página de Vendas Real):</label>
                <input type="text" id="input-target-url" placeholder="https://exemplo.com/checkout">
            </div>
            <button class="admin-btn" id="save-settings">Salvar Configurações</button>
            <button class="admin-btn cancel" id="close-admin">Fechar</button>
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURAÇÕES INICIAIS
        // ==========================================

        const MASTER_PASSWORD_HASH = "fa3b31e701850e337e5ea1c6a02ea743740613e4831132827cdb719c4da46b35";

        let config = {
            backgroundUrl: 'https://github.com/henriquegomespense-create/choicesinsights/blob/main/ozenvitta/assets/image/ozenback.png?raw=true',
            targetUrl: 'https://choicesinsights.com/ozenvitta/'
        };

        if (localStorage.getItem('fakePageConfig')) {
            config = JSON.parse(localStorage.getItem('fakePageConfig'));
        }

        function applyConfig() {
            document.getElementById('background-image').style.backgroundImage = `url('${config.backgroundUrl}')`;
        }

        applyConfig();

        // ==========================================
        // LÓGICA DE REDIRECIONAMENTO
        // ==========================================

        document.body.addEventListener('click', function (e) {
            if (
                e.target.closest('#admin-trigger') ||
                e.target.closest('#password-modal') ||
                e.target.closest('#admin-panel')
            ) {
                return;
            }
            window.location.href = config.targetUrl;
        });

        // ==========================================
        // FUNÇÃO DE CRIPTOGRAFIA (HASH)
        // ==========================================

        // Função assíncrona que gera o hash SHA-256 de uma string
        async function sha256(message) {
            try {
                const msgBuffer = new TextEncoder().encode(message);
                const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
                return hashHex;
            } catch (error) {
                console.error("Erro ao gerar hash:", error);
                return null;
            }
        }

        // ==========================================
        // LÓGICA DO PAINEL DE ADMINISTRADOR
        // ==========================================

        const adminTrigger = document.getElementById('admin-trigger');
        const passwordModal = document.getElementById('password-modal');
        const adminPanel = document.getElementById('admin-panel');
        const submitPassword = document.getElementById('submit-password');
        const cancelPassword = document.getElementById('cancel-password');
        const masterPasswordInput = document.getElementById('master-password');
        const saveSettings = document.getElementById('save-settings');
        const closeAdmin = document.getElementById('close-admin');
        const inputBgUrl = document.getElementById('input-bg-url');
        const inputTargetUrl = document.getElementById('input-target-url');

        adminTrigger.addEventListener('click', (e) => {
            e.stopPropagation();
            masterPasswordInput.value = '';
            passwordModal.style.display = 'flex';
            masterPasswordInput.focus();
        });

        // NOVA LÓGICA DE VERIFICAÇÃO DE SENHA (Com Hash)
        submitPassword.addEventListener('click', async (e) => {
            e.stopPropagation();

            const senhaDigitada = masterPasswordInput.value;
            if (!senhaDigitada) return;

            // Gera o hash da senha que o usuário digitou
            const hashDigitado = await sha256(senhaDigitada);

            // Compara o hash gerado com o hash salvo no código
            if (hashDigitado === MASTER_PASSWORD_HASH) {
                passwordModal.style.display = 'none';
                openAdminPanel();
            } else {
                alert('Senha incorreta!');
            }
        });

        masterPasswordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                submitPassword.click();
            }
        });

        cancelPassword.addEventListener('click', (e) => {
            e.stopPropagation();
            passwordModal.style.display = 'none';
        });

        function openAdminPanel() {
            inputBgUrl.value = config.backgroundUrl;
            inputTargetUrl.value = config.targetUrl;
            adminPanel.style.display = 'flex';
        }

        saveSettings.addEventListener('click', (e) => {
            e.stopPropagation();

            const newBgUrl = inputBgUrl.value.trim();
            const newTargetUrl = inputTargetUrl.value.trim();

            if (newBgUrl && newTargetUrl) {
                config.backgroundUrl = newBgUrl;
                config.targetUrl = newTargetUrl;

                localStorage.setItem('fakePageConfig', JSON.stringify(config));
                applyConfig();

                alert('Configurações salvas com sucesso!');
                adminPanel.style.display = 'none';
            } else {
                alert('Por favor, preencha todos os campos.');
            }
        });

        closeAdmin.addEventListener('click', (e) => {
            e.stopPropagation();
            adminPanel.style.display = 'none';
        });

        passwordModal.addEventListener('click', (e) => e.stopPropagation());
        adminPanel.addEventListener('click', (e) => e.stopPropagation());

    </script>
</body>

</html>
