<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviso de Cookies</title>
    <style>
        /* Reset e Estilos Globais */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* Fundo (Print da Página de Vendas) */
        #background-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #f0f0f0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
        }

        /* Ajuste específico para celular na vertical */
        @media (max-width: 768px) and (orientation: portrait) {
            #background-image {
                background-position: center top;
            }
        }

        /* Overlay para escurecer levemente o fundo */
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        /* O Falso Pop-up de Cookies */
        .cookie-popup {
            background-color: #ffffff;
            width: 90%;
            max-width: 480px;
            border-radius: 12px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            position: relative;
        }

        .cookie-popup h2 {
            font-size: 24px;
            color: #111;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .cookie-popup p {
            font-size: 15px;
            color: #555;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        /* Botões */
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 14px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            flex: 1;
        }

        .btn-allow {
            background-color: #000000;
            color: #ffffff;
        }

        .btn-allow:hover {
            background-color: #333333;
        }

        .btn-close {
            background-color: transparent;
            color: #111111;
            border: 1px solid #cccccc;
        }

        .btn-close:hover {
            background-color: #f5f5f5;
        }

        .footer-text {
            font-size: 12px;
            color: #888;
            margin-top: 15px;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }

        /* Botão Discreto de Administrador */
        #admin-trigger {
            position: absolute;
            bottom: 10px;
            right: 10px;
            z-index: 10;
            background-color: rgba(0, 0, 0, 0.1);
            color: rgba(255, 255, 255, 0.5);
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        #admin-trigger:hover {
            background-color: rgba(0, 0, 0, 0.8);
            color: #fff;
        }

        /* Modais do Administrador */
        .admin-modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .admin-modal-content {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            width: 90%;
            max-width: 450px;
            text-align: left;
            max-height: 90vh;
            overflow-y: auto;
        }

        .admin-modal-content h3 {
            margin-bottom: 20px;
            font-size: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        .admin-btn {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }

        .admin-btn:hover {
            background-color: #0056b3;
        }

        .admin-btn.cancel {
            background-color: #ccc;
            color: #333;
            margin-top: 5px;
        }

        /* Responsividade para telas muito pequenas */
        @media (max-width: 480px) {
            .cookie-popup {
                padding: 25px 20px;
            }
            .cookie-popup h2 {
                font-size: 20px;
            }
            .cookie-popup p {
                font-size: 14px;
            }
            .btn-container {
                flex-direction: column;
                gap: 10px;
            }
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- Fundo com a imagem da página de vendas -->
    <div id="background-image"></div>

    <!-- Overlay e Pop-up Falso -->
    <div id="overlay">
        <div class="cookie-popup">
            <h2>Cookie Policy</h2>
            <p>This site uses cookies to customize content and ads, provide social media resources and analyze our traffic. By clicking "Allow", you agree to the use of cookies. For more information, visit our Cookie Policy.</p>
            
            <div class="btn-container">
                <button class="btn btn-allow">Allow</button>
                <button class="btn btn-close">Close</button>
            </div>
            
            <div class="footer-text">Your privacy is important to us</div>
        </div>
    </div>

    <!-- Botão para abrir o painel de administrador -->
    <button id="admin-trigger">Admin</button>

    <!-- Modal de Senha -->
    <div id="password-modal" class="admin-modal">
        <div class="admin-modal-content">
            <h3>Acesso Restrito</h3>
            <div class="form-group">
                <label>Senha Mestre:</label>
                <input type="password" id="master-password" placeholder="Digite a senha...">
            </div>
            <button class="admin-btn" id="submit-password">Entrar</button>
            <button class="admin-btn cancel" id="cancel-password">Cancelar</button>
        </div>
    </div>

    <!-- Modal do Painel de Administrador -->
    <div id="admin-panel" class="admin-modal">
        <div class="admin-modal-content">
            <h3>Painel de Administrador</h3>
            <div class="form-group">
                <label>URL da Imagem de Fundo (Desktop):</label>
                <input type="text" id="input-bg-url" placeholder="https://exemplo.com/imagem.jpg">
            </div>
            <div class="form-group">
                <label>URL da Imagem de Fundo (Celular):</label>
                <input type="text" id="input-bg-url-mobile" placeholder="https://exemplo.com/imagem-mobile.jpg">
            </div>
            <div class="form-group">
                <label>Link de Destino (Página de Vendas Real):</label>
                <input type="text" id="input-target-url" placeholder="https://exemplo.com/checkout">
            </div>
            <button class="admin-btn" id="save-settings">Salvar Configurações</button>
            <button class="admin-btn cancel" id="close-admin">Fechar</button>
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURAÇÕES INICIAIS
        // ==========================================
        
        // Hash SHA-256 da senha mestre
        const MASTER_PASSWORD_HASH = "fa3b31e701850e337e5ea1c6a02ea743740613e4831132827cdb719c4da46b35";

        async function sha256Hex(texto) {
            const encoder = new TextEncoder();
            const data = encoder.encode(texto);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            return hashHex;
        }

        // ==========================================
        // VERSÃO DAS CONFIGURAÇÕES
        // ==========================================
        // Aumente este número sempre que quiser forçar a atualização
        // das configurações no navegador
        const CONFIG_VERSION = 3;

        // Configurações Padrão
        let config = {
            backgroundUrl: 'https://github.com/henriquegomespense-create/choicesinsights/blob/main/ozenvitta/assets/image/ozenback.png?raw=true',
            // ⚠️ SUBSTITUA pela URL da sua imagem vertical para celular
            backgroundUrlMobile: 'https://github.com/henriquegomespense-create/choicesinsights/blob/main/ozenvitta/assets/image/ozenback-mobile.png?raw=true',
            targetUrl: 'https://app.monetizze.com.br/r/AQL25844591',
            version: CONFIG_VERSION
        };

        // Carregar configurações salvas no navegador (localStorage)
        const savedConfig = localStorage.getItem('fakePageConfig');

        if (savedConfig) {
            const parsed = JSON.parse(savedConfig);

            // Só usa o que está salvo se a versão for a mesma
            if (parsed.version === CONFIG_VERSION) {
                config = parsed;
            } else {
                // Se a versão for diferente, ignora e remove o antigo
                localStorage.removeItem('fakePageConfig');
            }
        }

        // ==========================================
        // APLICAR CONFIGURAÇÕES NA PÁGINA
        // ==========================================
        function applyConfig() {
            // Detecta se é celular na vertical
            const isMobilePortrait = window.innerWidth <= 768 && window.innerHeight > window.innerWidth;

            // Escolhe a imagem correta
            const bgUrl = (isMobilePortrait && config.backgroundUrlMobile)
                ? config.backgroundUrlMobile
                : config.backgroundUrl;

            document.getElementById('background-image').style.backgroundImage = `url('${bgUrl}')`;
        }

        // Executa ao carregar a página
        applyConfig();

        // Reaplica se o usuário girar o celular ou redimensionar a janela
        window.addEventListener('resize', applyConfig);
        window.addEventListener('orientationchange', applyConfig);

        // ==========================================
        // LÓGICA DE REDIRECIONAMENTO
        // ==========================================
        document.body.addEventListener('click', function(e) {
            if (
                e.target.closest('#admin-trigger') || 
                e.target.closest('#password-modal') || 
                e.target.closest('#admin-panel')
            ) {
                return;
            }
            
            window.location.href = config.targetUrl;
        });

        // ==========================================
        // LÓGICA DO PAINEL DE ADMINISTRADOR
        // ==========================================

        const adminTrigger = document.getElementById('admin-trigger');
        const passwordModal = document.getElementById('password-modal');
        const adminPanel = document.getElementById('admin-panel');
        const submitPassword = document.getElementById('submit-password');
        const cancelPassword = document.getElementById('cancel-password');
        const masterPasswordInput = document.getElementById('master-password');
        const saveSettings = document.getElementById('save-settings');
        const closeAdmin = document.getElementById('close-admin');
        const inputBgUrl = document.getElementById('input-bg-url');
        const inputBgUrlMobile = document.getElementById('input-bg-url-mobile');
        const inputTargetUrl = document.getElementById('input-target-url');

        // Abrir modal de senha
        adminTrigger.addEventListener('click', (e) => {
            e.stopPropagation();
            masterPasswordInput.value = '';
            passwordModal.style.display = 'flex';
            masterPasswordInput.focus();
        });

        // Verificar Senha
        submitPassword.addEventListener('click', async (e) => {
            e.stopPropagation();

            const senhaDigitada = masterPasswordInput.value;
            const hashDigitado = await sha256Hex(senhaDigitada);

            if (hashDigitado === MASTER_PASSWORD_HASH) {
                passwordModal.style.display = 'none';
                openAdminPanel();
            } else {
                alert('Senha incorreta!');
            }
        });

        // Permitir pressionar Enter na senha
        masterPasswordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                submitPassword.click();
            }
        });

        // Fechar modal de senha
        cancelPassword.addEventListener('click', (e) => {
            e.stopPropagation();
            passwordModal.style.display = 'none';
        });

        // Abrir Painel de Admin e preencher com os dados atuais
        function openAdminPanel() {
            inputBgUrl.value = config.backgroundUrl;
            inputBgUrlMobile.value = config.backgroundUrlMobile || '';
            inputTargetUrl.value = config.targetUrl;
            adminPanel.style.display = 'flex';
        }

        // Salvar Configurações
        saveSettings.addEventListener('click', (e) => {
            e.stopPropagation();
            
            const newBgUrl = inputBgUrl.value.trim();
            const newBgUrlMobile = inputBgUrlMobile.value.trim();
            const newTargetUrl = inputTargetUrl.value.trim();

            if (newBgUrl && newTargetUrl) {
                config.backgroundUrl = newBgUrl;
                config.backgroundUrlMobile = newBgUrlMobile || newBgUrl; // Se vazio, usa a de desktop
                config.targetUrl = newTargetUrl;
                config.version = CONFIG_VERSION;
                
                localStorage.setItem('fakePageConfig', JSON.stringify(config));
                
                applyConfig();
                
                alert('Configurações salvas com sucesso!');
                adminPanel.style.display = 'none';
            } else {
                alert('Por favor, preencha pelo menos a imagem de desktop e o link de destino.');
            }
        });

        // Fechar Painel de Admin
        closeAdmin.addEventListener('click', (e) => {
            e.stopPropagation();
            adminPanel.style.display = 'none';
        });

        // Impedir que cliques dentro dos modais fechem os modais ou redirecionem
        passwordModal.addEventListener('click', (e) => e.stopPropagation());
        adminPanel.addEventListener('click', (e) => e.stopPropagation());

    </script>
</body>
</html>
