<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aviso de Cookies</title>
    <style>
        /* Reset e Estilos Globais */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100vh;
            height: 100dvh; /* Corrige a barra de endereço no celular */
            overflow: hidden;
            background-color: #111;
        }

        /* Fundo (Print da Página de Vendas) */
        #background-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: top center;
            background-repeat: no-repeat;
            z-index: 1;
        }

        /* Overlay escuro */
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        /* O Falso Pop-up de Cookies */
        .cookie-popup {
            background-color: #ffffff;
            width: 90%;
            max-width: 480px;
            border-radius: 12px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            position: relative;
        }

        .cookie-popup h2 { font-size: 24px; color: #111; margin-bottom: 15px; font-weight: 600; }
        .cookie-popup p { font-size: 15px; color: #555; line-height: 1.5; margin-bottom: 25px; }

        .btn-container { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; }
        .btn { padding: 14px 30px; border-radius: 8px; font-size: 16px; font-weight: 500; cursor: pointer; border: none; transition: all 0.2s ease; flex: 1; }
        .btn-allow { background-color: #000000; color: #ffffff; }
        .btn-allow:hover { background-color: #333333; }
        .btn-close { background-color: transparent; color: #111111; border: 1px solid #cccccc; }
        .btn-close:hover { background-color: #f5f5f5; }

        .footer-text { font-size: 12px; color: #888; margin-top: 15px; border-top: 1px solid #eee; padding-top: 15px; }

        /* Botão Discreto de Administrador */
        #admin-trigger {
            position: absolute; bottom: 10px; right: 10px; z-index: 10;
            background-color: rgba(0, 0, 0, 0.1); color: rgba(255, 255, 255, 0.5);
            border: none; padding: 8px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; transition: all 0.3s;
        }
        #admin-trigger:hover { background-color: rgba(0, 0, 0, 0.8); color: #fff; }

        /* Modais (Senha e Admin) */
        .admin-modal {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.85); z-index: 100; justify-content: center; align-items: center;
        }

        .admin-modal-content {
            background-color: #fff; padding: 30px; border-radius: 8px;
            width: 90%; max-width: 400px; text-align: left; box-shadow: 0 15px 50px rgba(0,0,0,0.5);
        }

        .admin-modal-content h3 { margin-bottom: 20px; font-size: 20px; color: #111; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 14px; color: #333; font-weight: 500;}
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }

        .admin-btn {
            width: 100%; padding: 12px; background-color: #007bff; color: white;
            border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px; font-weight: 600;
        }
        .admin-btn:hover { background-color: #0056b3; }
        .admin-btn.cancel { background-color: #e0e0e0; color: #333; margin-top: 8px; }
        .admin-btn.cancel:hover { background-color: #ccc; }

        @media (max-width: 480px) {
            .cookie-popup { padding: 25px 20px; }
            .cookie-popup h2 { font-size: 20px; }
            .cookie-popup p { font-size: 14px; }
            .btn-container { flex-direction: column; gap: 10px; }
            .btn { width: 100%; }
            .admin-modal-content { padding: 20px; }
        }
    </style>
</head>
<body>

    <div id="background-image"></div>

    <div id="overlay">
        <div class="cookie-popup">
            <h2>Cookie Policy</h2>
            <p>This site uses cookies to customize content and ads, provide social media resources and analyze our traffic. By clicking "Allow", you agree to the use of cookies. For more information, visit our Cookie Policy.</p>
            
            <div class="btn-container">
                <button class="btn btn-allow">Allow</button>
                <button class="btn btn-close">Close</button>
            </div>
            
            <div class="footer-text">Your privacy is important to us</div>
        </div>
    </div>

    <button id="admin-trigger">Admin</button>

    <!-- Modal de Senha -->
    <div id="password-modal" class="admin-modal">
        <div class="admin-modal-content">
            <h3>Acesso Restrito</h3>
            <div class="form-group">
                <label>Senha Mestre:</label>
                <input type="password" id="master-password" placeholder="Digite a senha...">
            </div>
            <button class="admin-btn" id="submit-password">Entrar</button>
            <button class="admin-btn cancel" id="cancel-password">Cancelar</button>
        </div>
    </div>

    <!-- Modal do Painel de Administrador -->
    <div id="admin-panel" class="admin-modal">
        <div class="admin-modal-content">
            <h3>Painel de Administrador</h3>
            <div class="form-group">
                <label>URL da Imagem de Fundo (PC/Desktop):</label>
                <input type="text" id="input-bg-url">
            </div>
            <div class="form-group">
                <label>URL da Imagem de Fundo (Celular/Mobile):</label>
                <input type="text" id="input-bg-url-mobile" placeholder="Opcional. Se vazio, usa a do PC.">
            </div>
            <div class="form-group">
                <label>Link de Destino (Página de Vendas Real):</label>
                <input type="text" id="input-target-url">
            </div>
            <button class="admin-btn" id="save-settings">Salvar Configurações</button>
            <button class="admin-btn cancel" id="close-admin">Fechar</button>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. CONFIGURAÇÕES INICIAIS (SIMPLIFICADO)
        // ==========================================
        
        // SENHA MESTRA (Altere aqui para o que você quiser)
        const SENHA_MESTRA = "admin123"; 

        // Configurações Padrão (Seus links)
        let config = {
            backgroundUrl: 'https://github.com/henriquegomespense-create/choicesinsights/blob/main/ozenvitta/assets/image/ozenback.png?raw=true', 
            backgroundUrlMobile: '', 
            targetUrl: 'https://choicesinsights.com/ozenvitta/' 
        };

        // Carregar configurações salvas no navegador (se existirem)
        if (localStorage.getItem('fakePageConfig')) {
            config = JSON.parse(localStorage.getItem('fakePageConfig'));
        }

        // ==========================================
        // 2. FUNÇÕES DE APLICAR CONFIGURAÇÕES
        // ==========================================

        function applyConfig() {
            const bgElement = document.getElementById('background-image');
            const isMobile = window.innerWidth <= 768;
            const hasMobileBg = config.backgroundUrlMobile && config.backgroundUrlMobile.trim() !== "";

            if (isMobile && hasMobileBg) {
                bgElement.style.backgroundImage = `url('${config.backgroundUrlMobile}')`;
            } else {
                bgElement.style.backgroundImage = `url('${config.backgroundUrl}')`;
            }
        }

        applyConfig();
        window.addEventListener('resize', applyConfig);

        // ==========================================
        // 3. REDIRECIONAMENTO GLOBAL
        // ==========================================
        
        document.body.addEventListener('click', function(e) {
            // Se o clique for no botão Admin ou dentro dos modais, não redireciona
            if (e.target.closest('#admin-trigger') || e.target.closest('.admin-modal')) {
                return;
            }
            // Redireciona para a página de vendas
            window.location.href = config.targetUrl;
        });

        // ==========================================
        // 4. LÓGICA DO ADMINISTRADOR
        // ==========================================

        const adminTrigger = document.getElementById('admin-trigger');
        const passwordModal = document.getElementById('password-modal');
        const adminPanel = document.getElementById('admin-panel');
        const masterPasswordInput = document.getElementById('master-password');

        // Abrir modal de senha
        adminTrigger.addEventListener('click', (e) => {
            e.stopPropagation();
            masterPasswordInput.value = ''; // Limpa o campo
            passwordModal.style.display = 'flex';
            masterPasswordInput.focus();
        });

        // Verificar Senha (SIMPLES E DIRETO)
        document.getElementById('submit-password').addEventListener('click', (e) => {
            e.stopPropagation();
            
            if (masterPasswordInput.value === SENHA_MESTRA) {
                passwordModal.style.display = 'none';
                openAdminPanel();
            } else {
                alert('Senha incorreta! Tente novamente.');
            }
        });

        // Permitir apertar Enter na senha
        masterPasswordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('submit-password').click();
            }
        });

        // Fechar modal de senha
        document.getElementById('cancel-password').addEventListener('click', (e) => {
            e.stopPropagation();
            passwordModal.style.display = 'none';
        });

        // Abrir Painel de Admin e preencher com os dados atuais
        function openAdminPanel() {
            document.getElementById('input-bg-url').value = config.backgroundUrl;
            document.getElementById('input-bg-url-mobile').value = config.backgroundUrlMobile || '';
            document.getElementById('input-target-url').value = config.targetUrl;
            adminPanel.style.display = 'flex';
        }

        // Salvar Configurações do Painel
        document.getElementById('save-settings').addEventListener('click', (e) => {
            e.stopPropagation();
            
            const newBgUrl = document.getElementById('input-bg-url').value.trim();
            const newBgUrlMobile = document.getElementById('input-bg-url-mobile').value.trim();
            const newTargetUrl = document.getElementById('input-target-url').value.trim();

            if (newBgUrl && newTargetUrl) {
                config.backgroundUrl = newBgUrl;
                config.backgroundUrlMobile = newBgUrlMobile;
                config.targetUrl = newTargetUrl;
                
                // Salva no navegador
                localStorage.setItem('fakePageConfig', JSON.stringify(config));
                
                // Aplica a nova imagem de fundo
                applyConfig();
                
                alert('Configurações salvas com sucesso!');
                adminPanel.style.display = 'none';
            } else {
                alert('Por favor, preencha pelo menos a URL de fundo do PC e o Link de Destino.');
            }
        });

        // Fechar Painel de Admin
        document.getElementById('close-admin').addEventListener('click', (e) => {
            e.stopPropagation();
            adminPanel.style.display = 'none';
        });

        // Impedir que cliques dentro dos modais fechem eles ou redirecionem
        passwordModal.addEventListener('click', (e) => e.stopPropagation());
        adminPanel.addEventListener('click', (e) => e.stopPropagation());

    </script>
</body>
</html>
