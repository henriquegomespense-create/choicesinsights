<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You! | Choices Insights</title>
    <!-- Essa página não precisa ser indexada no Google -->
    <meta name="robots" content="noindex, nofollow">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background-color: #f9f9f9; color: #333; line-height: 1.6; text-align: center; }
        
        .header-container { width: 90%; max-width: 1200px; margin: 0 auto; display: flex; justify-content: center; padding: 20px 0; }
        .site-header { background-color: #ffffff; border-bottom: 1px solid #eaeaea; }
        .logo-img { width: 120px; height: auto; display: block; }
        
        .thankyou-container { width: 90%; max-width: 600px; margin: 60px auto; background: #ffffff; padding: 50px 30px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        
        .check-icon { font-size: 50px; color: #4CAF50; margin-bottom: 20px; }
        .thankyou-container h1 { font-size: 32px; color: #333; margin-bottom: 15px; }
        .thankyou-container p { font-size: 16px; color: #666; margin-bottom: 30px; }
        
        /* Botão para voltar e comprar */
        .btn-home { display: inline-block; background-color: #CD071C; color: #ffffff; text-decoration: none; padding: 15px 30px; border-radius: 5px; font-weight: bold; font-size: 16px; transition: background-color 0.3s; }
        .btn-home:hover { background-color: #000d89; }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="header-container">
            <img src="images/choicesinsights-banner2.png" alt="Choices Insights Logo" class="logo-img">
        </div>
    </header>

    <main class="thankyou-container">
        <div class="check-icon">✔️</div>
        <h1>Thank You for Subscribing!</h1>
        <p>Your email has been successfully added to our list. You will be the first to receive our exclusive curated products and offers.</p>
        
        <!-- Botão que leva de volta para a página inicial para ver os produtos -->
        <a href="index.html" class="btn-home">Explore Our Products</a>
    </main>
</body>
</html>
